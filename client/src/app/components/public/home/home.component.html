<div class="grid">
  <div class="col-12 md:col-6 lg:col-3">
    <button (click)="increment()" pButton pRipple type="button" label="Add counter" class="p-button-info"></button>
  </div>
  <div class="col-12 md:col-6 lg:col-3" style="align-self: center;">
    <div>Current Count: {{ count }}</div>
  </div>
  <div class="col-12 md:col-6 lg:col-3">
    <button (click)="getFakeData()"  pButton pRipple class="p-button-secondary">Fake data</button>
  </div>
  <div class="col-12 md:col-6 lg:col-3">
    <button (click)="getUsers()"  pButton pRipple class="p-button-success">Users data</button>
  </div>
</div>

<div class="grid">
  <div class="col-12 text-center m-auto mt-4">
    <div *ngIf="this.loading">Cargando...</div>
    <div *ngIf='!this.loading'>{{ fakeData | json }}</div>
  </div>
</div>
